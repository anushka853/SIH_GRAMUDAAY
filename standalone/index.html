<!DOCTYPE html>

  <style>
    :root {

      --att-x:1043.2; --att-y:515.1;

    @supports (height:100dvh) {

    html, body {

    #menu { display: none; }

    header.nav {

    }

    .brand {

    }
    .mark {

    .mark-inner { width: calc(7.4 * var(--u)); height: calc(7.4 * var(--u)); background: #151519; z-index: 1; }

    }

    .links {

      top: calc((var(--links-y) - 41) * var(--u));
      display: flex; gap: calc(var(--links-gap) * var(--u));
    }
    .links a {
      font-family: var(--font-text);

      font-weight: var(--w-nav);

      letter-spacing: var(--cta-ls);
      background: linear-gradient(180deg, #3d3d3f 0%, #1d1d20 100%);
      box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(255,255,255,.10), 0 calc(2 * var(--u)) calc(14 * var(--u)) rgba(0,0,0,.28);
      display: flex; align-items: center; justify-content: center;
      color: #fff; text-decoration: none;
      align-self: flex-start;
      margin-top: calc((var(--cta-y) - 41) * var(--u));

    }
    .cta span { transform: translateY(calc(var(--cta-dy) * var(--u))); }
    .cta:hover { filter: brightness(1.16); }
    .cta:active { transform: translateY(1px); }

    .burger { display: none; }

    main.hero {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: calc(var(--hero-gap) * var(--vu));
      padding-bottom: calc(4 * var(--vu));

    .h1 {
      font-family: var(--font-display);
      font-variation-settings: "opsz" 32;
      font-size: calc(var(--h1-fs) * var(--u));

      line-height: 1.10;
      letter-spacing: var(--display-ls);
      color: #fff;
      text-shadow: 0 calc(2 * var(--u)) calc(22 * var(--u)) rgba(0,0,0,.30);
      text-align: center;
    }

    .card {
      position: relative;
      width: calc(var(--card-w) * var(--u));
      height: calc(var(--card-h) * var(--u));
      border-radius: calc(var(--card-r) * var(--u));
      margin-right: calc(3 * var(--u));
      background: rgba(41,41,43,.955);
      -webkit-backdrop-filter: blur(calc(26 * var(--u))) saturate(112%);
      backdrop-filter: blur(calc(26 * var(--u))) saturate(112%);
      box-shadow: inset 0 0 0 1px rgba(214,228,255,.14), 0 calc(22 * var(--u)) calc(60 * var(--u)) rgba(0,0,0,.30);
    }

    .ph {
      position: absolute;
      left: calc((var(--ph-x) - var(--card-x)) * var(--u));
      top: calc((var(--ph-y) - var(--card-y)) * var(--u));
      right: calc(24 * var(--u));
      color: #8B8C8E;
      font-family: var(--font-text);
      font-size: calc(var(--ph-fs) * var(--u));
      font-weight: var(--w-regular);
      line-height: 1.35;
      letter-spacing: var(--body-ls);
      white-space: nowrap;
      overflow: hidden;
    }

    .tools {
      position: absolute;
      left: calc((var(--chips-x) - var(--card-x)) * var(--u));
      top: calc((var(--chips-y) - var(--card-y)) * var(--u));
      right: calc(-1 * var(--u));
      height: calc(var(--chip-h) * var(--u));
    }

    .chips { display: flex; align-items: center; gap: calc(var(--chip-gap) * var(--u)); }
    .chip {
      height: calc(var(--chip-h) * var(--u));
      border-radius: calc(var(--chip-r) * var(--u));

      font-size: calc(var(--chip-fs) * var(--u));

      display: flex; align-items: center;

      gap: calc(var(--ig) * var(--u));

    }
    .chip:hover {

      color: #c8c8cb;
    }
    .chip span { transform: translateY(calc(2 * var(--u))); }
    
    .right { position: absolute; inset: 0; pointer-events: none; }
    
    .model {
      position: absolute;
      pointer-events: auto;
      left: calc(510.2 * var(--u));
      top: calc(15.5 * var(--u));
      font-family: var(--font-text);
      font-size: calc(10.4 * var(--u));
      font-weight: var(--w-model);
      color: #98999C;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      gap: calc(6.2 * var(--u));
    }
    .model svg { width: calc(6.8 * var(--u)); fill: currentColor; }

    .attach {
      position: absolute;
      pointer-events: auto;
      left: calc(599.15 * var(--u));
      top: calc(10.14 * var(--u));
      color: #A9AAAD;
      cursor: pointer;
    }
    .attach:hover { color: #fff; }
    .attach svg { width: calc(19.79 * var(--u)); fill: currentColor; }

    .send {
      position: absolute;
      pointer-events: auto;
      left: calc(640 * var(--u));
      top: calc(2 * var(--u));
      width: calc(35 * var(--u));
      height: calc(35 * var(--u));
      border-radius: 50%;
      background: linear-gradient(163deg, #FBBC94 0%, #F49D70 46%, #E88654 100%);
      box-shadow: 0 calc(3 * var(--u)) calc(12 * var(--u)) rgba(210,110,60,.34);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: filter .18s, transform .1s;
    }
    .send:hover { filter: brightness(1.07); }
    .send:active { transform: scale(.95); }
    .send svg { width: calc(11.66 * var(--u)); fill: #fff; }

    footer.proof {
      flex: none; display: flex; flex-direction: column; align-items: center; gap: calc(52.3 * var(--vu));
    }
    .proof p {
      font-family: var(--font-display);
      font-variation-settings: "opsz" 32;
      font-size: calc(14.01 * var(--u));
      font-weight: var(--w-proof);
      letter-spacing: var(--proof-ls);
      color: rgba(255,255,255,.95);
      text-shadow: 0 calc(1 * var(--u)) calc(12 * var(--u)) rgba(0,0,0,.35);
    }
    .logos {
      display: flex; align-items: center; gap: calc(62 * var(--u));
      filter: drop-shadow(0 calc(1 * var(--u)) calc(10 * var(--u)) rgba(0,0,0,.30));
      color: #fff;
    }
    .google { width: calc(96.84 * var(--u)); fill: currentColor; }
    .cisco { width: calc(67.29 * var(--u)); fill: currentColor; }
    .adobe { width: calc(88.68 * var(--u)); fill: currentColor; }

    /* TABLET */
    @media (min-width:600px) and (max-width:1180px) and (min-height:600px) {
      :root { --u: 1px; }
      .frame { padding: clamp(24px,3.4vh,44px) clamp(28px,4.2vw,60px) clamp(26px,4.4vh,56px); }
      .h1 { font-size: clamp(27px,4.3vw,44px); line-height: 1.12; }
      .card {
        width: min(100%, clamp(516px,74vw,760px)); height: auto; margin-right: 0;
        padding: clamp(15px,1.9vw,24px); border-radius: clamp(17px,2.1vw,26px);
        display: flex; flex-direction: column; gap: clamp(20px,3.2vh,44px);
      }
      .ph { position: static; white-space: normal; font-size: clamp(11px,1.35vw,14px); line-height: 1.4; }
      .tools { position: static; height: auto; display: flex; flex-direction: row; flex-wrap: wrap; gap: clamp(10px,1.4vw,18px); }
      .chips { flex-wrap: nowrap; gap: clamp(6px,0.85vw,10px); }
      .chip { width: auto; height: clamp(29px,3.4vh,34px); padding: 0 clamp(7px,1vw,13px); font-size: clamp(9.6px,1.12vw,12.5px); }
      
      .right { position: static; display: flex; align-items: center; margin-left: auto; gap: 0; }
      .right > * { position: static; }
      .model { font-size: clamp(9.8px,1.12vw,12.5px); }
      .attach { margin-left: clamp(9px, 1.4vw, 20px); }
      .send { margin-left: clamp(9px, 1.3vw, 18px); width: clamp(32px, 3.5vw, 38px); height: clamp(32px, 3.5vw, 38px); }
      .proof { gap: clamp(15px,2.5vh,30px); }
    }

    /* PHONE (COMPACT) */
    @media (max-width:599px), (max-height:599px) and (max-width:1180px) {
      :root { --u: 1px; }
      .frame {
        padding: max(18px, env(safe-area-inset-top)) max(clamp(18px,5.2vw,40px), env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(clamp(18px,5.2vw,40px), env(safe-area-inset-left));
      }
      .links, .cta { display: none; }
      .burger {
        display: flex; width: 38px; height: 38px; border-radius: 11px;
        background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.14);
        align-items: center; justify-content: center; cursor: pointer;
      }
      
      #menu:checked ~ .sheet { grid-template-rows: 1fr; }
      .sheet {
        display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.32s cubic-bezier(.4,0,.2,1);
        position: absolute; top: max(70px, env(safe-area-inset-top)); right: max(18px, env(safe-area-inset-right)); z-index: 10;
      }
      .sheet-inner {
        overflow: hidden; background: rgba(24,24,27,.86); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);

      }
      .sheet-inner a { color: #fff; text-decoration: none; font-size: 15px; padding: 8px 12px; }
      .sheet-inner .m-start { background: #fff; color: #000; height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-weight: 500; }
      
      .mark { width: 30px; height: 30px; }
      .mark::after { width: 15px; height: 15px; }
      .mark-inner { width: 6.5px; height: 6.5px; }
      
      .h1 { width: 100%; max-width: 15ch; font-size: clamp(29px,7.6vw,50px); line-height: 1.14; letter-spacing: -.012em; text-align: left; align-self: flex-start; }
      .card { width: 100%; max-width: 600px; height: auto; display: flex; flex-direction: column; gap: clamp(16px,4.6vh,34px); padding: clamp(13px,3.4vw,18px); }
      .ph { position: static; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: clamp(9.4px,2.95vw,14px); }

      .chips { flex-wrap: wrap; }
      .right { position: static; display: flex; align-items: center; justify-content: flex-start; }
      .right > * { position: static; }
      .attach { margin-left: auto; }

    /* Extra short mobile */
    @media (max-width:1180px) and (max-height:560px) {
      .hero { gap: 16px; }
      .h1 { font-size: clamp(24px,5.4vh,34px); }
      .proof { gap: 10px; }
      .frame { padding-top: 10px; }

    /* ANIMATIONS */
    html.anim .brand { opacity: 0; will-change: transform, opacity; }
    html.anim .mark { will-change: transform; }
    html.anim .links a { opacity: 0; will-change: transform, opacity; }
    html.anim .cta { opacity: 0; will-change: transform, opacity; }
    html.anim .h1 { opacity: 0; filter: blur(6px); will-change: transform, opacity, filter; }
    html.anim .card { opacity: 0; will-change: transform, opacity; }
    html.anim .ph { opacity: 0; will-change: transform, opacity; }
    html.anim .chips { opacity: 0; will-change: transform, opacity; }
    html.anim .right { opacity: 0; will-change: transform, opacity; }
    html.anim .send { will-change: transform; }
    html.anim .proof p { opacity: 0; will-change: transform, opacity; }
    html.anim .logos svg { opacity: 0; will-change: transform, opacity; }

    @keyframes e-settle-down { from { opacity: 0; transform: translateY(calc(-5 * var(--u))); } to { opacity: 1; transform: none; } }
    @keyframes e-settle-up { from { opacity: 0; transform: translateY(calc(6 * var(--u))); } to { opacity: 1; transform: none; } }
    @keyframes e-mark { from { transform: scale(.9); } to { transform: none; } }
    @keyframes e-focus { from { opacity: 0; transform: translateY(calc(14 * var(--u))); filter: blur(calc(6 * var(--u))); } to { opacity: 1; transform: none; filter: blur(0); } }
    @keyframes e-panel { from { opacity: 0; transform: translateY(calc(18 * var(--u))) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes e-populate { from { opacity: 0; transform: translateY(calc(4 * var(--u))); } to { opacity: 1; transform: none; } }
    @keyframes e-send { from { transform: scale(.82); } to { transform: none; } }

    html.anim .brand, html.anim .mark, html.anim .links a, html.anim .cta, html.anim .h1, html.anim .card, html.anim .ph, html.anim .chips, html.anim .right, html.anim .send, html.anim .proof p, html.anim .logos svg {

    html.anim .brand { animation: e-settle-down .58s var(--e-soft) .06s both; }
    html.anim .mark { animation: e-mark .62s var(--e-primary) .06s both; }
    html.anim .links a:nth-child(1) { animation: e-settle-down .50s var(--e-soft) .16s both; }

    html.anim .links a:nth-child(3) { animation: e-settle-down .50s var(--e-soft) .26s both; }
    html.anim .links a:nth-child(4) { animation: e-settle-down .50s var(--e-soft) .31s both; }
    html.anim .cta { animation: e-settle-down .55s var(--e-soft) .34s both; }
    html.anim .h1 { animation: e-focus 1.00s var(--e-primary) .30s both; }
    html.anim .card { animation: e-panel .90s var(--e-primary) .62s both; }
    html.anim .ph { animation: e-populate .50s var(--e-soft) .88s both; }
    html.anim .chips { animation: e-populate .50s var(--e-soft) .94s both; }
    html.anim .right { animation: e-populate .50s var(--e-soft) 1.00s both; }
    html.anim .send { animation: e-send .50s var(--e-primary) 1.00s both; }
    html.anim .proof p { animation: e-settle-up .55s var(--e-soft) 1.08s both; }

    html.anim .logos svg:nth-child(2) { animation: e-settle-up .55s var(--e-soft) 1.22s both; }
    html.anim .logos svg:nth-child(3) { animation: e-settle-up .55s var(--e-soft) 1.28s both; }

    @media (prefers-reduced-motion: reduce) {
      html.anim * { animation: none !important; transition: none !important; opacity: 1 !important; filter: none !important; transform: none !important; }
    }
  </style>
  <script>
    (function(){
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      document.documentElement.classList.add('anim');
      function clean() { document.documentElement.classList.remove('anim'); }
      setTimeout(clean, 2600);
    })();
  </script>
